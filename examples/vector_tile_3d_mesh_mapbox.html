        <script type="text/javascript">

            // ---------- CREATE A GlobeView FOR SUPPORTING DATA VISUALIZATION : ----------

            // Define camera initial position
            const placement = {
                // coord: new itowns.Coordinates('EPSG:4326', -71.310196, 41.490578),
                coord: new itowns.Coordinates('EPSG:4326', -71.057083, 42.361145),
                range: 5000,
                tilt: 45,
            };

            // `viewerDiv` will contain iTowns' rendering area (`<canvas>`)
            const viewerDiv = document.getElementById('viewerDiv');

            // Create a GlobeView
            const view = new itowns.GlobeView(viewerDiv, placement);

            // Define poles texture
            view.tileLayer.noTextureColor = new itowns.THREE.Color(0x95c1e1);

            // Disable atmosphere lighting
            view.getLayerById('atmosphere').visible = false;
            view.getLayerById('atmosphere').fog.enable = false;

            // Setup loading screen and debug menu
            setupLoadingScreen(viewerDiv, view);
            const debugMenu = new GuiTools('menuDiv', view, 300);

            let cameraState = {
                tilt: 45,
                heading: 0,
            }

            // Add camera controls to GUI
            function addCameraControlsToGUI() {
                // Create camera controls folder
                const cameraFolder = debugMenu.gui.addFolder('Camera Controls');
                cameraFolder.open(); // Expand the folder by default
                
                // Add tilt slider (0-90 degrees range)
                cameraFolder.add(cameraState, 'tilt', 0, 90).name('Tilt (°)').onChange((value) => {
                    cameraState.tilt = value;
                });
                
                // Add heading slider (0-360 degrees range)
                cameraFolder.add(cameraState, 'heading', 0, 360).name('Heading (°)').onChange((value) => {
                    cameraState.heading = value;
                });
            }
            
            // Add camera controls to GUI
            addCameraControlsToGUI();

            // ---------- DISPLAY CONTEXTUAL DATA : ----------

            // Add one imagery layer to the scene. This layer's properties are
            // defined in a json file, but it could be defined as a plain js
            // object. See `Layer` documentation for more info.
            const ortho = itowns.Fetcher.json('./layers/JSONLayers/Ortho.json')
                .then(function _(config) {
                    // config.source = new itowns.WMTSSource(config.source);
                    // var layer = new itowns.ColorLayer('Ortho', config);
                    // Set Ortho layer visibility to false to turn off satellite texture
                    // layer.visible = false;
                    // return view.addLayer(layer);
                });

            // Add an elevation layer, whose properties are defined in a json 
            // file.
            function addElevationLayerFromConfig(config) {
                config.source = new itowns.WMTSSource(config.source);
                view.addLayer(new itowns.ElevationLayer(config.id, config))
                    .then(debugMenu.addLayerGUI.bind(debugMenu));
            }
            itowns.Fetcher.json('./layers/JSONLayers/IGN_MNT_HIGHRES.json')
                .then(addElevationLayerFromConfig);
            


            // ---------- DISPLAY VECTOR TILED BUILDING DATA AS 3D MESHES : ----------

            // Define the source of the building data. We use the mapbox Streets v8 tileset and Style JSON
            // https://docs.mapbox.com/data/tilesets/reference/mapbox-streets-v8/

            const buildingsSource = new itowns.VectorTilesSource({
                style: 'mapbox://styles/mapbox/streets-v8',
                accessToken: 'pk.eyJ1IjoiZnRvcm9tYW5vZmYiLCJhIjoiY2xrc2Zpa2o3MDQxNTNxcG5sczJyaTlncyJ9.5KFKdMLIiy-b_fAjSVhjCQ',
                filter: (layer) => {
                    return layer.id === 'building';
                },
            });

            const contoursSource = new itowns.VectorTilesSource({
                style: {
                    sources: {
                        sourceTiles: {
                            tiles: ['http://localhost:3000/depth/{z}/{x}/{y}']
                        }
                    },
                    layers: [{
                        id: 'depth',
                        source: 'sourceTiles',
                        'source-layer': 'depth',
                        type: 'fill',
                        // paint: {
                            // 'fill-color': 'green',
                        // }
                    }],
                }
            });

            const bostonSource = new itowns.VectorTilesSource({
                style: {
                    sources: {
                        sourceTiles: {
                            tiles: ['http://localhost:3000/boston/{z}/{x}/{y}']
                        }
                    },
                    layers: [{
                        id: 'boston',
                        source: 'sourceTiles',
                        'source-layer': 'boston',
                        type: 'fill',
                        paint: {
                            'fill-color': 'red',
                        }
                    }],
                }
            });

            // Get buildings ground elevation
            function altitudeBuildings(properties, ctx) {
                if (ctx.coordinates) {
                    return itowns.DEMUtils.getElevationValueAt(view.tileLayer, ctx.coordinates);
                }
            }

            // Create a FeatureGeometryLayer to support building data.
            var buildingsLayer = new itowns.FeatureGeometryLayer('VTBuilding',{
                batchId: function (property, featureId) { return featureId; },
                source: buildingsSource,
                zoom: {
                    min: 15,
                },
                style: {
                    fill: {
                        // the building with type = roof doesn't have same properties as the others
                        base_altitude: (p, ctx) => {
                            return (altitudeBuildings(p, ctx) || 0) + (p.min_height || 0);
                        },
                        extrusion_height: (p) => {
                            return p.height || 0;
                        },
                    },
                }
            });

            var contoursLayer = new itowns.FeatureGeometryLayer('depth',{
                batchId: function (property, featureId) { return featureId; },
                source: contoursSource,
                zoom: {
                    min: 15,
                },
                style: {
                    fill: {
                        extrusion_height: (p) => {
                            // return p.drval2 || 0;
                            return 50;
                        },
                        color: (p) => {
                            // Get the depth value
                            const depth = p.drval2 || 0;
                            
                            // Define min and max depth values for the color ramp
                            const minDepth = 0;
                            const maxDepth = 100; // Adjust based on your actual depth range
                            
                            // Normalize the depth value between 0 and 1
                            const normalizedDepth = Math.max(0, Math.min(1, (depth - minDepth) / (maxDepth - minDepth)));
                            
                            // Define color stops for the gradient from purple to red
                            // Interpolate from purple (lowest) to blue to green to yellow to red (highest)
                            let r, g, b;
                            
                            if (normalizedDepth < 0.25) {
                                // Purple to Blue
                                const t = normalizedDepth / 0.25;
                                r = Math.floor(128 * (1 - t));
                                g = 0;
                                b = 255;
                            } else if (normalizedDepth < 0.5) {
                                // Blue to Green
                                const t = (normalizedDepth - 0.25) / 0.25;
                                r = 0;
                                g = Math.floor(255 * t);
                                b = Math.floor(255 * (1 - t));
                            } else if (normalizedDepth < 0.75) {
                                // Green to Yellow
                                const t = (normalizedDepth - 0.5) / 0.25;
                                r = Math.floor(255 * t);
                                g = 255;
                                b = 0;
                            } else {
                                // Yellow to Red
                                const t = (normalizedDepth - 0.75) / 0.25;
                                r = 255;
                                g = Math.floor(255 * (1 - t));
                                b = 0;
                            }
                            
                            // Convert to hex color string
                            return `rgb(${r}, ${g}, ${b})`;
                        }
                    },
                }
            });

            var bostonLayer = new itowns.FeatureGeometryLayer('boston',{
                batchId: function (property, featureId) { return featureId; },
                source: bostonSource,
                zoom: {
                    min: 15,
                },
                style: {
                    fill: {
                        // the building with type = roof doesn't have same properties as the others
                        // base_altitude: (p, ctx) => {
                        //     return (altitudeBuildings(p, ctx) || 0) + (p.min_height || 0);
                        // },
                        // extrusion_height: (p) => {
                        //     return p.height || 0;
                        // },
                    },
                }
            });

            // Add the FeatureGeometryLayer to the scene and to the debug menu.
            // view.addLayer(buildingsLayer);

            view.addLayer(contoursLayer);

            view.addLayer(bostonLayer);

            // ---------- DEBUG TOOLS : ----------

            debug.createTileDebugUI(debugMenu.gui, view);

            function picking(event) {
                if(view.controls.isPaused) {
                    var htmlInfo = document.getElementById('info');
                    var intersects = view.pickObjectsAt(event, 3, 'VTBuilding');
                    var properties;
                    var info;
                    var batchId;

                    htmlInfo.innerHTML = ' ';

                    if (intersects.length) {
                        batchId = intersects[0].object.geometry.attributes.batchId.array[intersects[0].face.a];
                        properties = intersects[0].object.feature.geometries[batchId].properties;

                        Object.keys(properties).map(function (objectKey) {
                            var value = properties[objectKey];
                            if (value) {
                                var key = objectKey.toString();
                                if (key[0] !== '_' && key !== 'geometry_name') {
                                    info = value.toString();
                                    htmlInfo.innerHTML +='<li><b>' + key + ': </b>' + info + '</li>';
                                }
                            }
                        });
                    }
                }
            }

            for (var layer of view.getLayers()) {
                if (layer.id === 'VTBuilding') {
                    layer.whenReady.then( function _(layer) {
                        var gui = debug.GeometryDebug.createGeometryDebugUI(debugMenu.gui, view, layer);
                        debug.GeometryDebug.addWireFrameCheckbox(gui, view, layer);
                        window.addEventListener('mousemove', picking, false);
                    });
                }
            }

            // Add a simple 3D cube to the scene
            function addCube() {
                // Define the cube size and material
                const geometry = new itowns.THREE.BoxGeometry(200, 200, 400);
                const material = new itowns.THREE.MeshBasicMaterial({
                    color: 0xff0000,
                    wireframe: true,
                });
                
                // Create the cube mesh
                const cube = new itowns.THREE.Mesh(geometry, material);
                
                // Set cube position using geographical coordinates
                const longitude = -71.057083;
                const latitude = 42.361145;
                const altitude = 300; // Meters above ground
                
                // Create geographic coordinates
                const coordCube = new itowns.Coordinates('EPSG:4326', longitude, latitude, altitude);
                
                // Convert to view's reference system
                const coordView = coordCube.as(view.referenceCrs);
                
                // Set position directly using toVector3
                coordView.toVector3(cube.position);
                
                // Orient the cube to point up from the globe surface
                // cube.lookAt(0, 0, 0);
                // cube.lookAt(coordView.geodesicNormal.clone().multiplyScalar(1000).add(cube.position));
                // cube.lookAt(coordView.geodesicNormal.clone().multiplyScalar(1000));
                // cube.lookAt(cube.position)；
                
                // Add the cube to the scene
                view.scene.add(cube);

                cube.lookAt(0, 0, 0);
                cube.updateMatrixWorld(true);

                console.log('cube position:', cube.position)

                setInterval(() => {
                    cube.rotation.x += 0.001;
                    cube.updateMatrixWorld(true);
                    view.notifyChange();
                }, 10);
            }
            
            // Call the function to add the cube
            addCube();

            // Add scene lighting for better visibility of 3D models
            function addSceneLighting() {
                // Add ambient light for overall scene illumination
                const ambientLight = new itowns.THREE.AmbientLight(0xffffff, 2);
                view.scene.add(ambientLight);
                
                // Add directional light simulating sunlight
                const directionalLight = new itowns.THREE.DirectionalLight(0xffffff, 1);
                // Position the light high in the sky
                directionalLight.position.set(100, 100, 100);
                directionalLight.target.position.set(0, 0, 0);
                
                // Enable shadows for more realistic rendering
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 1024;
                directionalLight.shadow.mapSize.height = 1024;
                
                // Add directional light and its target to the scene
                view.scene.add(directionalLight);
                view.scene.add(directionalLight.target);
                
                // Notify iTowns that the scene has changed
                view.notifyChange();
            }
            
            // Call lighting setup before loading the model
            addSceneLighting();

            let boatModelRef = null;

            // Add a 3D boat model to the scene
            function addBoatModel() {
                // Create geographic coordinates for the boat
                const longitude = -71.057083;  // Slightly offset from the cube
                const latitude = 42.361145;
                const altitude = 5;  // Height above ground
  
                // Calculate position in the view's reference system
                const boatCoord = new itowns.Coordinates('EPSG:4326', longitude, latitude, altitude);
                const coordView = boatCoord.as(view.referenceCrs);
                
                // Create a loader for GLTF models
                const gltfLoader = new itowns.iGLTFLoader();
                
                // Load the boat model
                // Replace this URL with the path to your actual boat model
                gltfLoader.load(
                    // Resource URL - replace with your model path
                    './models/EGO.glb',
                    
                    // Called when the resource is loaded
                    (gltf) => {
                        const boatModel = gltf.scene;
                        
                        // Store reference to the boat model for updating position/rotation
                        boatModelRef = boatModel;
                        
                        // Set the boat position
                        coordView.toVector3(boatModel.position);
                        
                        console.log(boatModel);
                        
                        // Orient the boat to point up from the globe surface
                        boatModel.lookAt(coordView.geodesicNormal.clone().multiplyScalar(1000).add(boatModel.position));
                        
                        // Scale the model to an appropriate size
                        // Adjust this scale factor according to your model
                        // boatModel.scale.set(10, 10, 10);
                        
                        // Rotate model as needed to correct orientation
                        // Adjust these rotations based on your model's default orientation
                        boatModel.rotateX(Math.PI / 2);  // 90 degrees around X axis
                        
                        // Add a light at the top of the boat
                        const lightColor = 0xffaa00; // Warm yellow light
                        const lightIntensity = 2;
                        const lightDistance = 500; // How far the light reaches
                        const lightDecay = 2; // How quickly light intensity diminishes with distance
                        
                        // Create a point light
                        const boatLight = new itowns.THREE.PointLight(
                            lightColor,
                            lightIntensity,
                            lightDistance,
                            lightDecay
                        );
                        
                        // Position the light at the top of the boat
                        // You may need to adjust these coordinates based on your model's size and shape
                        boatLight.position.set(0, 10, 0); // x, y, z offset from the boat's origin
                        
                        // Add the light as a child of the boat model
                        boatModel.add(boatLight);
                        
                        // Add the boat to the scene
                        view.scene.add(boatModel);
                        boatModel.updateMatrixWorld(true);
                        
                        // Notify iTowns that the scene has changed and needs rendering
                        view.notifyChange();
                    },
                    
                    // Called while loading is progressing
                    (xhr) => {
                        console.log(`Boat model: ${(xhr.loaded / xhr.total * 100)}% loaded`);
                    },
                    
                    // Called when loading has errors
                    (error) => {
                        console.error('An error happened while loading the boat model:', error);
                    }
                );
            }
            
            // Call the function to add the boat
            addBoatModel();

            // ------------------------------------- new features ----------------------------------------------
            // 1. listen to replay_sync.py, get the messages & update the boat
            // 2. change camera upon orbiting, CTRL+LMB orbiting
            // 3. 3 camera modes

            let minimapObjectsGroup;
            minimapObjectsGroup = new itowns.THREE.Group();
            view.scene.add(minimapObjectsGroup);

            const hostname = window.location.hostname || 'localhost';

            let cameraFollowMode = true;

            let position = {latitude: 0, longitude: 0};
            let headingN = 0;
            let boatOrigin = null;

            let sharedLatLonNMEA = [];//new Float64Array(bufferNMEA, 4 * Float64Array.BYTES_PER_ELEMENT, 2);
            sharedLatLonNMEA[0] = position.latitude;
            sharedLatLonNMEA[1] = position.longitude;

            let nmeaStatus = false;
            let nmeaSocket;
            let nmeaReconnectInterval = 1000; // Initial interval for reconnection
            let nmeaReconnectAttempts = 0;
            const nmeaMaxReconnectAttempts = 5; // Set max attempts as needed
            const nmeaMaxReconnectInterval = 16000; // Set max interval as needed

            function initWorker() {
                // Initialize the worker
                // Fixed: Using a regular URL since import.meta.url might not be supported in all contexts

                // WebSocket connection for NMEA data (port 3636)
                nmeaSocket = new WebSocket(`ws://${hostname}:3636`);

                nmeaSocket.addEventListener('open', function () {
                    nmeaStatus = true;
                    console.log('Connected to NMEA WebSocket');
                    nmeaReconnectInterval = 1000; // Reset interval after a successful connection
                    nmeaReconnectAttempts = 0;
                });

                // nmeaSocket.addEventListener('message', (event) => {handleNMEAEvent(event)});
                nmeaSocket.addEventListener('message', function (event) {
                    const data = JSON.parse(event.data);
                    if (data.Heading) {
                        headingN = data.Heading;
                        updateBoatHeading();
                    }
                    if (data.Latitude && data.Longitude) {
                        if (!boatOrigin) {
                            boatOrigin = {
                                lat: data.Latitude,
                                lon: data.Longitude,
                            };
                            console.log("Boat origin set to:", boatOrigin);
                        }
                        position.latitude = data.Latitude;
                        position.longitude = data.Longitude;

                        // todo Steve: test boston area for now
                        // position.latitude = 42.361145;
                        // position.longitude = -71.057083;
                        sharedLatLonNMEA[0] = position.latitude;
                        sharedLatLonNMEA[1] = position.longitude;
                        updateBoatPosition();
                        updateCameraPosition();
                    }
                });

                nmeaSocket.addEventListener('error', function (event) {
                    console.error('NMEA WebSocket error observed:', event);
                });

                nmeaSocket.addEventListener('close', function () {
                    nmeaStatus = false;
                    console.log('NMEA WebSocket is closed now. Attempting to reconnect...');
                    if (nmeaReconnectAttempts < nmeaMaxReconnectAttempts) {
                        setTimeout(initWorker, nmeaReconnectInterval);
                        nmeaReconnectInterval = Math.min(nmeaReconnectInterval * 2, nmeaMaxReconnectInterval);
                        nmeaReconnectAttempts++;
                    } else {
                        console.error('Max reconnect attempts reached. Cannot reconnect to NMEA WebSocket.');
                    }
                });
            }

            initWorker();

            // Function to update boat position based on received position data
            function updateBoatPosition() {
                if (!boatModelRef) return;
                
                try {
                    // Create coordinates for the new position
                    const boatCoord = new itowns.Coordinates('EPSG:4326', position.longitude, position.latitude, 5);
                    const coordView = boatCoord.as(view.referenceCrs);
                    
                    // Update boat position
                    coordView.toVector3(boatModelRef.position);
                    
                    // Look at the center of the earth or adjust as needed
                    boatModelRef.lookAt(coordView.geodesicNormal.clone().multiplyScalar(1000).add(boatModelRef.position));

                    boatModelRef.rotateX(Math.PI / 2);
                    
                    // Update matrices
                    boatModelRef.updateMatrixWorld(true);
                    
                    // Notify iTowns that the scene has changed
                    view.notifyChange();
                } catch (error) {
                    console.error('Error updating boat position:', error);
                }
            }
            
            // Function to update boat heading based on received heading data
            function updateBoatHeading() {
                if (!boatModelRef) return;
                
                try {
                    const boatCoord = new itowns.Coordinates('EPSG:4326', position.longitude, position.latitude, 5);
                    const coordView = boatCoord.as(view.referenceCrs);

                    boatModelRef.lookAt(coordView.geodesicNormal.clone().multiplyScalar(1000).add(boatModelRef.position));

                    boatModelRef.rotateX(Math.PI / 2);

                    boatModelRef.updateMatrixWorld(true);

                    const headingRad = ((headingN + 180) * Math.PI) / 180;
                    // console.log(headingRad)
                    boatModelRef.rotateOnAxis(coordView.geodesicNormal, headingRad);
                    // boatModelRef.rotateOnAxis(new itowns.THREE.Vector3(0, 1, 0), headingRad);

                    boatModelRef.updateMatrixWorld(true);
                    
                    // Notify iTowns that the scene has changed
                    view.notifyChange();
                } catch (error) {
                    console.error('Error updating boat heading:', error);
                }
            }

            function updateCameraPosition(force = false) {
                if (!boatModelRef || !cameraFollowMode) return;
                
                try {
                    // Create coordinates for the boat's current position
                    const boatCoord = new itowns.Coordinates('EPSG:4326', position.longitude, position.latitude, 5);
                    
                    // Setup camera parameters similar to initial view placement
                    const cameraParams = {
                        coord: boatCoord,
                        range: 500,  // Distance from boat (in meters)
                        tilt: cameraState.tilt,    // Camera tilt angle (45 degrees looking down)
                        // heading: headingN  // Align camera with boat heading
                        heading: cameraState.heading  // Align camera with boat heading
                    };


                    
                    // The issue might be with the animation parameter (true) in lookAtCoordinate
                    // Let's use a different approach to position the camera more directly
                    
                    // Get the position vector in iTowns coordinate system
                    const targetPosition = boatCoord.as(view.referenceCrs);
                    const positionVector = new itowns.THREE.Vector3();
                    targetPosition.toVector3(positionVector);
                    
                    // Calculate the camera position based on desired range, tilt, and heading
                    // const headingRad = (cameraState.heading * Math.PI) / 180;
                    const headingRad = (headingN * Math.PI) / 180;
                    const tiltRad = (cameraState.tilt * Math.PI) / 180;
                    
                    // Create an offset from the boat's position
                    const cameraOffset = new itowns.THREE.Vector3(
                        500 * Math.sin(headingRad) * Math.cos(tiltRad),
                        500 * Math.cos(headingRad) * Math.cos(tiltRad),
                        500 * Math.sin(tiltRad)
                    );
                    
                    // Set camera position and target
                    view.camera.camera3D.position.copy(positionVector).add(cameraOffset);
                    view.camera.camera3D.lookAt(positionVector);
                    
                    // Update the camera immediately without animation
                    view.notifyChange(view.camera.camera3D);
                    
                    // console.log('Camera updated immediately to follow boat');
                } catch (error) {
                    console.error('Error updating camera position:', error);
                }
            }

            // Add camera control GUI
            function addCameraControls() {
                // Create a button element
                const followBtn = document.createElement('button');
                followBtn.innerHTML = 'Toggle Camera Follow';
                followBtn.style.position = 'absolute';
                followBtn.style.top = '10px';
                followBtn.style.right = '10px';
                followBtn.style.zIndex = '1000';
                followBtn.style.padding = '10px';
                followBtn.style.backgroundColor = cameraFollowMode ? '#00aa00' : '#333';
                followBtn.style.color = 'white';
                followBtn.style.border = 'none';
                followBtn.style.borderRadius = '5px';
                followBtn.style.cursor = 'pointer';
                
                // Add toggle functionality
                followBtn.addEventListener('click', function() {
                    cameraFollowMode = !cameraFollowMode;
                    followBtn.style.backgroundColor = cameraFollowMode ? '#00aa00' : '#333';
                    
                    if (cameraFollowMode) {
                        updateCameraPosition();
                    }
                });
                
                // Add button to the document
                document.body.appendChild(followBtn);
            }
            
            // Initialize camera controls
            addCameraControls();

            // currently they don't do anything
            viewerDiv.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                // updateCameraPosition(true);
                return false;
            });

            viewerDiv.addEventListener('pointermove', (e) => {
                e.preventDefault();
                // updateCameraPosition(true);
                return false;
            });

            function checkAndFetchData() {
                setInterval(() => {
                        fetchAndUpdateMarkers();
                }, 1000);

                setInterval(() => {
                        fetchAndUpdatePOIs();
                }, 1000);
            }
            checkAndFetchData();

            async function fetchAndUpdateMarkers() {
                if (sharedLatLonNMEA) {
                    const tileData = await fetchTileData(sharedLatLonNMEA[0], sharedLatLonNMEA[1]); 
                    const dirData = await fetchDirData(sharedLatLonNMEA[0], sharedLatLonNMEA[1]);
                    // const dirData = null;
                    if (tileData && dirData) {
                        // if (tileData) {
                        addMarkers(tileData.features, dirData?.features);
                    }
                }
            }

            async function fetchAndUpdatePOIs() {
                if (sharedLatLonNMEA) {
                    const poiData = await fetchPOIData(sharedLatLonNMEA[0], sharedLatLonNMEA[1]); 
                    if (poiData) {
                        addPOIs(poiData.features);
                    }

            function gpsToLocalCoordinates(lat, lon, alt = 0, reference) {
                const objCoord = new itowns.Coordinates('EPSG:4326', lon, lat, alt);
                const coordView = objCoord.as(view.referenceCrs);
                
                const result = new itowns.THREE.Vector3();
                // Update boat position
                coordView.toVector3(result);
                
                return result;
            }

            function gpsToLocalCoordinates_old(lat, lon, alt = 0, reference) {
                console.log(reference);
                // WGS84 ellipsoid parameters
                const a = 6378137.0; // semi-major axis, in meters
                const f = 1 / 298.257223563; // flattening
                const e2 = 2 * f - f * f; // first eccentricity squared

                // Convert degrees to radians
                const latRad = itowns.THREE.MathUtils.degToRad(lat);
                const lonRad = itowns.THREE.MathUtils.degToRad(lon);
                const refLatRad = itowns.THREE.MathUtils.degToRad(reference.lat);
                const refLonRad = itowns.THREE.MathUtils.degToRad(reference.lon);

                // Meridian radius of curvature at the reference latitude
                const N = a / Math.sqrt(1 - e2 * Math.sin(refLatRad) * Math.sin(refLatRad));

                // Scale factors for east and north directions
                const kx = N * Math.cos(refLatRad);
                const ky = N * (1 - e2) / Math.sqrt(1 - e2 * Math.sin(refLatRad) * Math.sin(refLatRad));

                // Compute local displacements:
                // dx: east offset
                const dx = (lonRad - refLonRad) * kx;
                // dz: north offset (inverted here so that north becomes negative z)
                const dz = -(latRad - refLatRad) * ky;

                console.log(dx, dz);

                // Return the local coordinates.
                // You can use `alt` directly for the Y coordinate, or replace it with a fixed value if desired.
                return new itowns.THREE.Vector3(dx, alt, dz);
            }

            function evaluateDirection(buoyPoint, safePoint) {
                const vector1 = buoyPoint.clone().sub(camera.position);
                const vector2 = safePoint.clone().sub(camera.position);

                const cameraForward = new itowns.THREE.Vector3(0, 0, 1).applyQuaternion(camera.quaternion);

                const isPoint1InFront = vector1.dot(cameraForward) < 0;
                const isPoint2InFront = vector2.dot(cameraForward) < 0;

                const screenVector1 = vector1.project(camera);
                const screenVector2 = vector2.project(camera);

                if (isPoint1InFront && isPoint2InFront) {
                    const direction = screenVector2.x - screenVector1.x;

                    if (direction > 0) {
                        // console.log("Point2 is to the right of Point1");
                        return "right";
                    } else if (direction < 0) {
                        // console.log("Point2 is to the left of Point1");
                        return "left";
                    } else {
                        // console.log("Point2 is directly in line with Point1");
                        return "inline";
                    }
                } else {
                    if (!isPoint1InFront) {
                        // console.log("Point1 is behind the camera");
                        return "buoyBehind";
                    }
                    if (!isPoint2InFront) {
                        // console.log("Point2 is behind the camera");
                        return "dirBehind";
                    }
                }
            }

            function getRelativePosition(dirObject, buoyObject) {
                const yellowBoxPosition = new itowns.THREE.Vector3();
                dirObject.getWorldPosition(yellowBoxPosition);

                const redBoxPosition = new itowns.THREE.Vector3();
                buoyObject.getWorldPosition(redBoxPosition);

                const cameraPosition = new itowns.THREE.Vector3();
                camera.getWorldPosition(cameraPosition);

                const cameraToYellowBox = new itowns.THREE.Vector3().subVectors(yellowBoxPosition, cameraPosition).normalize();
                const cameraToRedBox = new itowns.THREE.Vector3().subVectors(redBoxPosition, cameraPosition).normalize();

                const crossProduct = new itowns.THREE.Vector3().crossVectors(cameraToYellowBox, cameraToRedBox);

                if (crossProduct.y > 0) {
                    return "right";
                } else if (crossProduct.y < 0) {
                    return "left";
                }
            }
